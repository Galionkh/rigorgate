name: Publish contributor challenge

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-contributor-challenge.yml"
      - ".github/workflows/contributor-launch.patch"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    name: Apply, verify, and publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply contributor challenge patch
        id: patch
        shell: bash
        run: |
          patch_file=".github/workflows/contributor-launch.patch"

          if git apply --check "$patch_file"; then
            git apply "$patch_file"
            git add -A
            echo "changed=true" >> "$GITHUB_OUTPUT"
          elif git apply --reverse --check "$patch_file"; then
            echo "Contributor challenge is already applied."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Patch does not match the current main branch." >&2
            exit 1
          fi

      - name: Run full verification
        if: steps.patch.outputs.changed == 'true'
        run: |
          make verify
          node --check lab/app.js
          git diff --cached --check

      - name: Commit and push to main
        if: steps.patch.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build contributor challenge funnel"
          git push origin HEAD:main
