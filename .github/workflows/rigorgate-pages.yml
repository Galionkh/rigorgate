name: Publish RigorGate rename

on:
  push:
    branches: [main]
    paths:
      - "rigorgate.patch"
      - ".github/workflows/rigorgate-pages.yml"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rigorgate-rename
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Apply and verify RigorGate rename
        shell: bash
        run: |
          test -f rigorgate.patch
          git apply --check rigorgate.patch
          git apply rigorgate.patch
          git add -A
          make verify
          node --check lab/app.js
          git diff --cached --check

      - name: Commit verified code
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm rigorgate.patch
          git add -A
          git commit -m "Rename project to RigorGate"
          git push origin HEAD:main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload Replay Lab
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./lab

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
