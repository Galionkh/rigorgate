name: Publish RigorGate logo and social preview

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-logo-social-preview.yml"
      - ".github/workflows/logo-social-preview.zip"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: rigorgate-logo-social-preview
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install the reviewed identity assets
        run: |
          unzip -o .github/workflows/logo-social-preview.zip -d .

      - name: Verify the complete project
        run: make verify

      - name: Publish the tested identity files to main
        run: |
          git config user.name "rigorgate-publisher[bot]"
          git config user.email "rigorgate-publisher[bot]@users.noreply.github.com"
          git add README.md assets/rigorgate-logo.svg assets/rigorgate-logo.png assets/social-preview.svg assets/social-preview.png
          git add lab/assets/rigorgate-logo.png lab/assets/social-preview.png lab/index.html lab/styles.css tests/test_replay_lab.py
          git commit -m "Add RigorGate logo and social preview"
          git push origin HEAD:main

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload verified site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./lab

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
