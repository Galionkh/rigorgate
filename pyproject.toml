[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rigorgate"
version = "0.2.0"
description = "Audit-first open-source equity research engine built to expose weak decisions"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Khader Ghalioun"}]
keywords = [
  "equity-research",
  "stock-screener",
  "quantitative-finance",
  "backtesting",
  "sec-edgar",
  "alpaca",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Galionkh/rigorgate"
Documentation = "https://github.com/Galionkh/rigorgate/tree/main/docs"
Issues = "https://github.com/Galionkh/rigorgate/issues"

[project.scripts]
rigorgate-demo = "rigorgate.demo:main"
rigorgate-lab = "rigorgate.replay_lab:main"
rigorgate-scan = "rigorgate.scanner:main"
rigorgate-events = "rigorgate.events:main"

[tool.setuptools.packages.find]
include = ["rigorgate*"]
