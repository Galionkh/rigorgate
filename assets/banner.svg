    <path d="M50 166 87 126l33 22 62-82" fill="none" stroke="url(#accent)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="50" cy="166" r="8" fill="#36d399"/><circle cx="87" cy="126" r="8" fill="#36d399"/><circle cx="120" cy="148" r="8" fill="#5ee7ff"/><circle cx="182" cy="66" r="8" fill="#5ee7ff"/>
  </g>
  <g transform="translate(365 112)" fill="#eefcff">
